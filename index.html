<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Minecraft Meta Embeds Code -->
  <meta name="keywords" content="eaglercraft, minecraft, minecraftjavaedition, javaedition, minecraftforfree, free, java, edition, minecraft for free, javaforfree" />
  <meta property="og:title" content="Minecraft Launcher">
  <meta property="og:description" content="Play Minecraft Java Edition">
  <meta property="og:image" content="https://minecraftjava.pages.dev/assets/logoWithBackground.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://minecraftjava.pages.dev/">

  <!-- Optional: Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Minecraft Launcher">
  <meta name="twitter:description" content="Play Minecraft Java Edition">
  <meta name="twitter:image" content="htpps://minecraftjava.pages.dev/assets/logoWithBackground.png">

  <!-- Other Important Stuff for Header -->
  <link rel="icon" type="image/x-icon" href="logo.svg">
  <title>Minecraft Launcher</title>
  <!-- Styles -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Fonts */
    @font-face { font-family: 'MinecraftBold'; src: url('/assets/Minecraft-Bold.otf') format('opentype'); }
    @font-face { font-family: 'Minecraft'; src: url('/assets/Minecraft.otf') format('opentype'); }

    body {
      height: 100vh;
      width: 100vw;
      font-family: 'Minecraft', monospace;
      background: #1c1c1c url('/assets/tile_dirt.png') repeat;
      background-size: 64px 64px;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    header {
      background: #202020;
      border-bottom: 4px solid #2e7d32;
      padding: 12px;
      text-align: center;
      z-index: 2;
      position: relative;
    }
    #launcherLogo { max-height: 60px; width: auto; display: inline-block; }

    /* 🔹 Layout */
    .main { flex: 1; display: flex; flex-direction: row; position: relative; }
    .sidebar {
      background: #2b2b2b; border-right: 4px solid #2e7d32;
      width: 220px; padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .sidebar a {
      text-decoration: none; color: #fff;
      background: #3c3c3c; border: 2px solid #555;
      padding: 10px; display: flex; align-items: center;
      font-size: 16px; transition: all 0.2s;
    }
    .sidebar a:hover {
      background: #2e7d32; border-color: #1b5e20; transform: translateY(-2px);
    }
    .block-icon { width: 24px; height: 24px; margin-right: 8px; }

    .content {
      flex: 1; background: rgba(0,0,0,0.65);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 20px;
    }

    /* 🔹 Splash text */
    @keyframes splashZoom {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    #splashText {
      font-family: 'Minecraft', monospace;
      font-size: 24px;
      color: #ffee00;
      text-shadow: 2px 2px #000;
      margin-bottom: 15px;
      display: inline-block;
      animation: splashZoom 0.5s infinite ease-in-out;
    }

    /* 🔹 Version select */
    label { font-size: 18px; margin-bottom: 8px; color: #c8ffc8; text-shadow: 1px 1px #000; }
    select {
      font-size: 16px; padding: 12px; width: 260px;
      border: 2px solid #555; border-radius: 4px;
      background: #2b2b2b; color: white; margin-bottom: 25px;
      font-family: 'Minecraft', monospace;
    }
    select option { background: #2b2b2b; color: #fff; }

    /* 🔹 Play button */
    .play-button {
      background: #2e7d32; border: 4px solid #1b5e20;
      padding: 16px 60px; font-size: 22px; font-weight: bold;
      cursor: pointer; text-transform: uppercase; color: #fff;
      font-family: 'MinecraftBold', monospace;
      text-shadow: 2px 2px #000;
      animation: pulse 2s infinite;
      transition: all 0.2s;
    }
    .play-button:hover { background: #43a047; transform: scale(1.05); }
    @keyframes pulse {
      0%,100%{ box-shadow: 0 0 10px #2e7d32; }
      50%{ box-shadow: 0 0 20px #43a047; }
    }

    /* 🔹 Progress bar */
    .progress-bar { width: 300px; height: 20px; background: #111; border: 2px solid #555; margin-top: 20px; display: none; }
    .progress { height: 100%; width: 0%; background: linear-gradient(90deg, #2e7d32, #66bb6a); transition: width 0.5s; }
    #progressMessage { margin-top: 12px; font-size: 16px; color: #c8ffc8; text-shadow: 1px 1px #000; }

    /* 🔹 Footer */
    footer { background: #202020; border-top: 4px solid #2e7d32; text-align: center; padding: 8px; font-size: 14px; color: #bbb; position: relative; }

    /* 🔹 Mobile Layout */
    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .sidebar {
        width: 100%; flex-direction: row; overflow-x: auto;
        border-right: none; border-bottom: 4px solid #2e7d32; padding: 10px 5px;
      }
      .sidebar a { flex: 0 0 auto; margin-right: 8px; padding: 8px 12px; font-size: 14px; }
      .content { width: 100%; padding: 15px; }
      .play-button { padding: 12px 40px; font-size: 18px; }
      select { width: 100%; }
      #launcherLogo { max-height: 50px; }
    }
  </style>
</head>
<body>

  <header>
    <img src="/assets/Java.svg" alt="Minecraft Launcher Logo" id="launcherLogo">
  </header>

  <div class="main">
    <div class="sidebar">
      <a href="help"><img src="/assets/Book.webp" class="block-icon" alt=""> Help Pages</a>
      <a href="updates.html"><img src="/assets/Crystal.webp" class="block-icon" alt=""> Update Log</a>
      <a href="https://www.minecraftforum.net/"><img src="/assets/bookquil.webp" class="block-icon" alt=""> Minecraft Forums</a>
      <a href="https://minecraft.wiki"><img src="/assets/world.webp" class="block-icon" alt=""> Minecraft Wiki</a>
      <a href="/help/articles/brewing/"><img src="/help/articles/brewing/images/potions/glass_bottle.png" class="block-icon" alt=""> Brewing Guide</a>
    </div>

    <div class="content">
      <div id="splashText"></div>

      <label for="versionSelect">Choose Minecraft Version:</label>
      <select id="versionSelect">
        <option value="/versions/1_14">Vanilla 1.14 (Beta) (No Singleplayer Support)</option>
        <option value="/versions/1_12_2.html">Vanilla 1.12</option>
        <option value="/versions/1_8.html">Vanilla 1.8</option>
        <option value="/versions/1_5_2.html">Vanilla 1.5.2</option>
        <option value="/versions/1_3.html">Vanilla 1.3</option>
        <option value="/versions/beta/1_7_3.html">Beta 1.7.3</option>
        <option value="/versions/indev.html">Indev</option>
        <option value="minecraft://">Open Minecraft Bedrock (Must have Bedorck installed)</option>
        <option value="/versions/custom">Other Clients</option>
      </select>

      <button class="play-button" id="playBtn">Play</button>

      <div class="progress-bar" id="progressBar">
        <div class="progress" id="progressFill"></div>
      </div>

      <p id="progressMessage"></p>
    </div>
  </div>

  <footer>Not affiated by Mojang or Microsoft</footer>

  <audio id="clickSound" src="/assets/click.mp3" preload="auto"></audio>

  <script>
    // 🔹 Load splash messages
    const splashText = document.getElementById('splashText');
    fetch('/assets/splashMessages.json')
      .then(res => res.json())
      .then(messages => {
        splashText.innerText = messages[Math.floor(Math.random() * messages.length)];
      })
      .catch(() => splashText.innerText = "Welcome to the Launcher!");

    // 🔹 Play button sound
    const clickSound = document.getElementById('clickSound');
    document.getElementById('playBtn').addEventListener('click', () => {
      clickSound.currentTime = 0;
      clickSound.play().catch(() => {});
      launchGame();
    });

    // 🔹 Launch game simulation
    function launchGame() {
      const progressBar = document.getElementById("progressBar");
      const progressFill = document.getElementById("progressFill");
      const message = document.getElementById("progressMessage");
      const version = document.getElementById("versionSelect").value;

      progressBar.style.display = "block";
      progressFill.style.width = "0%";
      message.innerText = "";

      const tasks = [
        { name: "Verifying assets...", progress: 25 },
        { name: "Checking RAM...", progress: 50 },
        { name: "Loading libraries...", progress: 75 },
        { name: "Launching Minecraft...", progress: 100 }
      ];

      let currentTask = 0;
      function randomDuration() { return 500 + Math.random() * 2000; }

      function runNextTask() {
        if (currentTask >= tasks.length) {
          window.location.href = version;
          return;
        }
        const task = tasks[currentTask];
        message.innerText = task.name;
        setTimeout(() => {
          progressFill.style.width = task.progress + "%";
          currentTask++;
          runNextTask();
        }, randomDuration());
      }
      runNextTask();
    }
  </script>

</body>
</html>
