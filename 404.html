<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/x-icon" href="logo.svg">
  <title>404 - Minecraft Launcher</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face { font-family: 'MinecraftBold'; src: url('/assets/Minecraft-Bold.otf') format('opentype'); }
    @font-face { font-family: 'Minecraft'; src: url('/assets/Minecraft.otf') format('opentype'); }

    body {
      font-family: 'Minecraft', monospace;
      background: #1c1c1c url('/assets/tile_dirt.png') repeat;
      background-size: 64px 64px;
      color: #e0e0e0;
      overflow-y: auto; /* ENABLE vertical scrolling */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #202020;
      border-bottom: 4px solid #2e7d32;
      padding: 12px;
      text-align: center;
      flex-shrink: 0;
    }
    #launcherLogo { max-height: 60px; width: auto; }

    .main {
      display: flex;
      flex-direction: row;
      flex: 1;
      min-height: 0; /* allow flex children to shrink */
    }

    .sidebar {
      background: #2b2b2b;
      border-right: 4px solid #2e7d32;
      width: 220px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }
    .sidebar a {
      text-decoration: none;
      color: #fff;
      background: #3c3c3c;
      border: 2px solid #555;
      padding: 10px;
      display: flex;
      align-items: center;
      font-size: 16px;
      transition: all 0.2s;
    }
    .sidebar a:hover { background: #2e7d32; border-color: #1b5e20; transform: translateY(-2px); }
    .block-icon { width: 24px; height: 24px; margin-right: 8px; }

    .content {
      flex: 1;
      background: rgba(0,0,0,0.65);
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* top-aligned content */
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: visible; /* allow inner content to expand */
    }

    .content img {
      max-width: 60%;
      height: auto;
      margin-bottom: 20px;
      border: 4px solid #2e7d32;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(46,125,50,0.7);
    }

    h1 {
      font-family: 'MinecraftBold', monospace;
      font-size: 72px;
      color: #ffee00;
      text-shadow: 2px 2px #000;
      margin-bottom: 20px;
    }

    p {
      font-size: 24px;
      color: #c8ffc8;
      text-shadow: 1px 1px #000;
      margin-bottom: 30px;
    }

    .home-button {
      background: #2e7d32;
      border: 4px solid #1b5e20;
      padding: 16px 40px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      color: #fff;
      font-family: 'MinecraftBold', monospace;
      text-shadow: 2px 2px #000;
      transition: all 0.2s;
    }
    .home-button:hover { background: #43a047; transform: scale(1.05); }

    footer {
      background: #202020;
      border-top: 4px solid #2e7d32;
      text-align: center;
      padding: 8px;
      font-size: 14px;
      color: #bbb;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 4px solid #2e7d32; padding: 10px 5px; }
      .sidebar a { flex: 0 0 auto; margin-right: 8px; padding: 8px 12px; font-size: 14px; }
      .content { width: 100%; padding: 15px; }
      .content img { max-width: 80%; }
      .home-button { padding: 12px 30px; font-size: 18px; }
      #launcherLogo { max-height: 50px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="/assets/Java.svg" alt="Minecraft Launcher Logo" id="launcherLogo">
  </header>

  <div class="main">
    <div class="content">
      <img src="/assets/404render.jpg" alt="404 Render">
      <h1>404</h1>
      <p>Oops! The page you’re looking for doesn’t exist.</p>
      <button class="home-button" onclick="window.location.href='/'">Go Home</button>
    </div>
  </div>

  <footer>Not affiliated with Mojang or Microsoft</footer>
</body>
</html>
